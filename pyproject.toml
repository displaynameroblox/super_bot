[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-bot"
version = "2.1.0a1"
description = "Local-first Super Bot chat server with accounts, encrypted clients and a local web client"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
models = ["huggingface_hub>=0.27,<2"]
pdf = ["pypdf>=5,<7"]

[project.urls]
Homepage = "https://github.com/displaynameroblox/super_bot"

[project.scripts]
super-bot-server = "Ai.server:start_server"
super-bot = "Ai.chat_app:main"
super-bot-account = "Ai.account_app:main"
super-bot-web = "Ai.web_client:main"
super-bot-manager = "Ai.local_manager:main"

[tool.setuptools]
packages = ["Ai"]
include-package-data = false

[tool.setuptools.package-data]
Ai = ["web/*.html", "web/*.js", "web/*.css", "*.ipynb", "requirements.txt", "release-public.pem"]

[tool.setuptools.dynamic]
dependencies = {file = ["Ai/requirements.txt"]}
