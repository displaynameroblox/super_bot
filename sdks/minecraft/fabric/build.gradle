plugins { id 'fabric-loom' version '1.8.13' }
base { archivesName = 'superbot-minecraft-fabric-1.21.1' }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.7+1.21.1'
    implementation project(':common')
    include project(':common')
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
