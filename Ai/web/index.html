<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Bot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="auth-view" class="card" hidden>
    <h1>Super Bot</h1>
    <p class="muted">Your account and saved chats stay on this computer. The selected AI provider receives working context.</p>
    <div class="tabs">
      <button type="button" id="tab-login" class="tab active">Sign in</button>
      <button type="button" id="tab-register" class="tab">Create account</button>
      <button type="button" id="tab-recover" class="tab">Recover</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <label>Username <input id="username" name="username" autocomplete="username" required></label>
      <label id="display-row" hidden>Display name (optional) <input id="display-name" maxlength="64"></label>
      <label id="code-row" hidden>Recovery code <input id="recovery-code" autocomplete="off"></label>
      <label><span id="password-label">Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" id="auth-submit">Sign in</button>
    </form>
    <p id="auth-message" class="message" role="alert"></p>
  </main>

  <div id="app-view" class="layout" hidden>
    <aside class="sidebar">
      <div class="sidebar-head">
        <strong id="who"></strong>
        <button type="button" id="open-settings" class="link">Account</button>
        <button type="button" id="open-knowledge" class="link">Knowledge</button>
      </div>
      <button type="button" id="new-chat">+ New chat</button>
      <input id="search" type="search" placeholder="Search chats" aria-label="Search chats">
      <ul id="chat-list"></ul>
    </aside>
    <section class="chat">
      <div id="messages" aria-live="polite"></div>
      <form id="send-form">
        <input id="message" maxlength="1000" placeholder="Message Super Bot" autocomplete="off" disabled>
        <button type="submit" id="send" disabled>Send</button>
      </form>
      <p id="chat-message" class="message" role="alert"></p>
    </section>
  </div>

  <dialog id="settings">
    <h2>Account</h2>
    <p id="account-id" class="muted"></p>
    <form id="profile-form">
      <label>Display name <input id="profile-name" maxlength="64"></label>
      <button type="submit">Save profile</button>
    </form>
    <form id="password-form">
      <label>Current password <input id="current-password" type="password" autocomplete="current-password" required></label>
      <label>New password <input id="new-password" type="password" autocomplete="new-password" required></label>
      <button type="submit">Change password</button>
    </form>
    <form id="recovery-form">
      <label>Password (to create a recovery code) <input id="recovery-password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Create recovery code</button>
      <output id="recovery-output"></output>
    </form>
    <div class="row">
      <button type="button" id="logout">Sign out</button>
      <button type="button" id="logout-all">Sign out everywhere</button>
    </div>
    <form id="delete-form" class="danger">
      <label>Delete account and all chats — enter password <input id="delete-password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Delete account</button>
    </form>
    <p id="settings-message" class="message" role="alert"></p>
    <button type="button" id="close-settings" class="link">Close</button>
  </dialog>
  <dialog id="knowledge">
    <h2>Knowledge library</h2>
    <p class="muted">Sources in this library are available only to this account.</p>
    <ul id="knowledge-list"></ul>
    <p id="knowledge-message" class="message" role="alert"></p>
    <button type="button" id="refresh-knowledge">Refresh</button>
    <button type="button" id="close-knowledge" class="link">Close</button>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
